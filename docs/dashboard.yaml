# BE WAVE dashboard view – native Home Assistant cards only (no HACS cards needed).
# Dashboard → ⋮ → Edit → ⋮ → Raw configuration editor, paste under `views:`
# and replace the entity ids with yours (Settings → Entities, search: bewave).
views:
- title: Security
  path: security
  icon: mdi:shield-home
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: alarm_control_panel.bewave_alarm
    show_name: false
    show_state: true
    show_icon: true
  - type: entity
    entity: select.bewave_heating_mode_whole_house
    show_name: false
    show_state: true
    show_icon: true
  - type: entity
    entity: climate.bewave_living_room_radiator
    show_name: true
    show_state: true
    show_icon: true
    name: Living room
    state_content: current_temperature
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Alarm
      heading_style: title
      icon: mdi:shield-home
    - type: tile
      entity: alarm_control_panel.bewave_alarm
      name: Alarm
      state_content:
      - state
      - last_changed
      grid_options:
        columns: 12
      features:
      - type: alarm-modes
        modes:
        - armed_away
        - disarmed
      features_position: bottom
    - type: heading
      heading: Motion
      heading_style: subtitle
      icon: mdi:motion-sensor
    - type: tile
      entity: binary_sensor.bewave_hallway_motion
      name: Hallway
      vertical: true
      state_content: last_changed
      grid_options:
        columns: 6
    - type: tile
      entity: binary_sensor.bewave_living_room_motion
      name: Living room
      vertical: true
      state_content: last_changed
      grid_options:
        columns: 6
    - type: heading
      heading: Virtual devices
      heading_style: subtitle
      icon: mdi:swap-horizontal-bold
    - type: tile
      entity: switch.bewave_leaving_home
      name: Leaving home
      state_content:
      - state
      - last_changed
      grid_options:
        columns: 12
      tap_action:
        action: toggle
  - type: grid
    cards:
    - type: heading
      heading: Heating
      heading_style: title
      icon: mdi:radiator
    - type: tile
      entity: select.bewave_heating_mode_whole_house
      name: Whole house
      grid_options:
        columns: 12
      features_position: inline
      features:
      - type: select-options
    - type: thermostat
      entity: climate.bewave_living_room_radiator
      name: Living room
      show_current_as_primary: true
      features:
      - type: climate-preset-modes
        style: icons
        preset_modes:
        - manual
        - schedule
        - eco
        - boost
    - type: tile
      entity: sensor.living_room_radiator_valve_opening
      name: Valve
      grid_options:
        columns: 12
      features:
      - type: bar-gauge
      features_position: inline
  - type: grid
    cards:
    - type: heading
      heading: Temperatures
      heading_style: title
      icon: mdi:thermometer
    - type: tile
      entity: sensor.bewave_living_room_temperature
      name: Living room
      features:
      - type: trend-graph
        hours_to_show: 24
      features_position: bottom
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: sensor.bewave_hallway_temperature
      name: Hallway
      features:
      - type: trend-graph
        hours_to_show: 24
      features_position: bottom
      grid_options:
        columns: 6
        rows: 2
    - type: heading
      heading: Hub
      heading_style: title
      icon: mdi:router-wireless
    - type: tile
      entity: switch.bewave_led
      name: LED
      vertical: true
      icon: mdi:led-on
      tap_action:
        action: toggle
      grid_options:
        columns: 4
    - type: tile
      entity: switch.bewave_grade_2
      name: Grade 2
      vertical: true
      icon: mdi:shield-star
      grid_options:
        columns: 4
      tap_action:
        action: toggle
        confirmation:
          text: Change the Grade 2 mode of the hub?
      icon_tap_action:
        action: toggle
        confirmation:
          text: Change the Grade 2 mode of the hub?
    - type: tile
      entity: switch.bewave_satel_server
      name: SATEL
      vertical: true
      icon: mdi:cloud-lock
      grid_options:
        columns: 4
      tap_action:
        action: toggle
        confirmation:
          text: Change the hub's SATEL cloud connection? Without it the Be Wave app does not work away from home.
      icon_tap_action:
        action: toggle
        confirmation:
          text: Change the hub's SATEL cloud connection? Without it the Be Wave app does not work away from home.
    - type: heading
      heading: Batteries
      heading_style: subtitle
      icon: mdi:battery-heart-variant
    - type: tile
      entity: sensor.bewave_hallway_battery
      name: Hallway detector
      grid_options:
        columns: 12
    - type: tile
      entity: sensor.bewave_living_room_radiator_battery
      name: Living room head
      grid_options:
        columns: 12
